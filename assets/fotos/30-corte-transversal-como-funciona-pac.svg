<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Brick/Tile Subtle Pattern like weBoost "Cómo Funciona" diagram -->
    <pattern id="wallBrick" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#fcfcfd"/>
      <path d="M0 0h48v24H0z" fill="none" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M24 0v12M0 12h48M12 12v12M36 12v12" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <pattern id="subSoil" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f1f5f9"/>
      <path d="M0 20L20 0M-5 5L5 -5M15 25L25 15" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
    <!-- Drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- White Clean Background -->
  <rect width="1200" height="760" fill="#ffffff" rx="14"/>

  <!-- Header Title in exact "Cómo Funciona" style -->
  <text x="55" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#991b36">Cómo Funciona — Corte Transversal Edificio Municipal PAC</text>
  <text x="55" y="86" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">Recorrido real de bajada vertical por ducto/shaft (18,28 m), ubicación en Racks existentes y distribución por cielo falso hacia Domos Interiores</text>

  <!-- Decorative Clouds (matching reference image aesthetic) -->
  <g stroke="#64748b" stroke-width="1.8" fill="#ffffff">
    <path d="M870 155 H1065 A22 22 0 0 0 1045 122 A36 36 0 0 0 980 100 A44 44 0 0 0 895 125 A20 20 0 0 0 870 155 Z"/>
    <path d="M820 165 H905 A14 14 0 0 0 892 145 A22 22 0 0 0 845 140 A15 15 0 0 0 820 165 Z"/>
  </g>

  <!-- Ground / Subterranean Earth Cut Indicator -->
  <rect x="45" y="510" width="1110" height="205" fill="url(#subSoil)" rx="6"/>
  <line x1="40" y1="510" x2="1160" y2="510" stroke="#64748b" stroke-width="3" stroke-dasharray="10,5"/>
  <rect x="48" y="484" width="155" height="22" rx="4" fill="#475569"/>
  <text x="125" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NIVEL CALLE (±0,00 m)</text>

  <!-- Decorative Bush on Ground Level Left -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="1.8">
    <path d="M45 510 Q45 470 80 475 Q105 445 140 468 Q170 468 175 510 Z" opacity="0.85"/>
  </g>

  <!-- MAIN BUILDING STRUCTURE (3 LEVELS: PISO 2, PISO 1 + ÓVALO, PISO -1 SUBTERRÁNEO) -->
  <rect x="155" y="210" width="955" height="490" fill="url(#wallBrick)" stroke="#64748b" stroke-width="3"/>

  <!-- Roof Concrete Slab (+8,25 m) -->
  <rect x="145" y="194" width="975" height="18" fill="#aeb7c2" stroke="#475569" stroke-width="2"/>
  <text x="1110" y="207" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#1e293b">LOSA TECHUMBRE (+8,25 m)</text>

  <!-- Floor Slab between Piso 2 and Piso 1 (+4,20 m) -->
  <rect x="155" y="345" width="955" height="14" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>

  <!-- Concrete Slab between Piso 1 and Piso -1 Subterráneo (±0,00 m — Heavy Attenuation) -->
  <rect x="155" y="502" width="955" height="18" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  <text x="630" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">LOSA HORMIGÓN ARMADO ENTREPISO (-35 dB ATENUACIÓN CELULAR NATURAL)</text>

  <!-- Foundation Slab (-3,50 m) -->
  <rect x="145" y="696" width="975" height="16" fill="#64748b" stroke="#334155" stroke-width="2"/>

  <!-- LEVEL LABELS (LEFT MARGIN) -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800">
    <rect x="165" y="222" width="175" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="177" y="241" font-size="13" fill="#0f172a">PISO 2 (+4,20 m)</text>
    <text x="177" y="256" font-size="10.5" fill="#64748b" font-weight="600">Alcaldía / SECPLA (Paso Shaft)</text>

    <rect x="165" y="370" width="175" height="42" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="177" y="389" font-size="13" fill="#9a3412">PISO 1 (±0,00 m)</text>
    <text x="177" y="404" font-size="10.5" fill="#c2410c" font-weight="600">Atención Público + Sala Concejo</text>

    <rect x="165" y="530" width="175" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="177" y="549" font-size="13" fill="#991b1b">PISO -1 (-3,50 m)</text>
    <text x="177" y="564" font-size="10" fill="#dc2626" font-weight="700">ZONA CIEGA SUBTERRÁNEA</text>
    <text x="177" y="575" font-size="9.5" fill="#7f1d1d" font-weight="600">Seguridad / Móviles / Informática</text>
  </g>

  <!-- VERTICAL CABLE SHAFT / DUCTO DE CORRIENTES DÉBILES -->
  <rect x="360" y="212" width="56" height="484" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="388" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" fill="#475569" transform="rotate(-90 388 300)">SHAFT VERTICAL CORRIENTES DÉBILES</text>

  <!-- ARCHITECTURAL FURNITURE & ROOM DIVIDERS (Subtle Line Art like Reference Image) -->
  <!-- Piso 2 Windows & Desks -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="#ffffff">
    <rect x="460" y="240" width="75" height="55" rx="3"/>
    <rect x="555" y="240" width="75" height="55" rx="3"/>
    <line x1="470" y1="255" x2="525" y2="255"/><line x1="470" y1="268" x2="515" y2="268"/>
    <line x1="565" y1="255" x2="620" y2="255"/><line x1="565" y1="268" x2="605" y2="268"/>
  </g>

  <!-- Piso 1: Óvalo Sala de Concejo Municipal (Right Side) -->
  <rect x="720" y="362" width="370" height="135" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="905" y="486" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#92400e">SALA DE CONCEJO MUNICIPAL (ÓVALO DEL ALCALDE — PISO 1)</text>
  <!-- Council Oval Table Line Art -->
  <ellipse cx="905" cy="448" rx="95" ry="18" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="850" y="422" width="18" height="8" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <rect x="896" y="420" width="18" height="8" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <rect x="942" y="422" width="18" height="8" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>

  <!-- Piso -1: 3 Critical Subterranean Zones -->
  <!-- Zone A: Subterráneo Seguridad Ciudadana, Video Wall & Despacho Móviles -->
  <rect x="495" y="535" width="205" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Video Wall monitors icon -->
  <rect x="515" y="550" width="50" height="30" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="540" y1="550" x2="540" y2="580" stroke="#3b82f6" stroke-width="1"/>
  <line x1="515" y1="565" x2="565" y2="565" stroke="#3b82f6" stroke-width="1"/>
  <text x="597" y="645" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">SEGURIDAD CIUDADANA</text>
  <text x="597" y="661" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">Video Wall + Despacho Móviles</text>
  <text x="597" y="676" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">+ Pasillo Interior Norte</text>

  <!-- Zone B: Subterráneo Servicios Especiales -->
  <rect x="715" y="535" width="175" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="802" y="645" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">SERVICIOS ESPECIALES</text>
  <text x="802" y="661" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">Subterráneo Ala Poniente</text>
  <text x="802" y="676" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">Operaciones Municipales</text>

  <!-- Zone C: Oficina Álvaro Carreño (Informática) & Pasillo Trasero -->
  <rect x="905" y="535" width="190" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1000" y="645" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a">OFICINA ÁLVARO CARREÑO</text>
  <text x="1000" y="661" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb">Depto. Informática (SECPLA)</text>
  <text x="1000" y="676" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">+ Pasillo Interior Trasero</text>

  <!-- ===================================================================== -->
  <!-- STEP 1: DONOR ANTENNA ON ROOFTOP MAST (ORANGE CIRCLE LIKE REFERENCE)  -->
  <!-- ===================================================================== -->
  <circle cx="245" cy="145" r="54" fill="#f97316" fill-opacity="0.32" stroke="#ea580c" stroke-width="2"/>
  <!-- 3.5m Galvanized Mast -->
  <line x1="245" y1="135" x2="245" y2="194" stroke="#334155" stroke-width="5"/>
  <polygon points="232,194 245,172 258,194" fill="none" stroke="#475569" stroke-width="2"/>
  <!-- Omni Plus 314422 Cylinder -->
  <rect x="238" y="106" width="14" height="36" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" filter="url(#softShadow)"/>
  <line x1="238" y1="134" x2="252" y2="134" stroke="#1e293b" stroke-width="2"/>
  <!-- Callout Badge 1 -->
  <rect x="295" y="102" width="380" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#softShadow)"/>
  <circle cx="318" cy="126" r="13" fill="#ea580c"/>
  <text x="318" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">1</text>
  <text x="340" y="124" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#9a3412">2x Antenas Donantes Omni Plus 360° (314422)</text>
  <text x="340" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">Montadas en Postes de 3,5 m (Techumbre Norte y Sur)</text>
  <text x="340" y="157" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c2410c">Captan las 10 radiobases SUBTEL + Pararrayos (859902)</text>

  <!-- ===================================================================== -->
  <!-- STEP 2: AMPLIFIER & SPLITTER IN RACKS (TEAL CIRCLE LIKE REFERENCE)    -->
  <!-- ===================================================================== -->
  <!-- Hub Sur (Piso 1 Rack) Teal Circle -->
  <circle cx="435" cy="442" r="44" fill="#0d9488" fill-opacity="0.26" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="415" y="422" width="40" height="44" rx="5" fill="#1e293b" stroke="#ffffff" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="421" y="428" width="28" height="18" rx="2" fill="#334155"/>
  <circle cx="443" cy="456" r="3" fill="#10b981"/>
  <text x="435" y="498" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#0f766e">RACK PISO 1 (SUR)</text>

  <!-- Hub Norte (Piso -1 Rack Seguridad) Teal Circle -->
  <circle cx="435" cy="615" r="48" fill="#0d9488" fill-opacity="0.32" stroke="#0d9488" stroke-width="2"/>
  <rect x="413" y="593" width="44" height="48" rx="6" fill="#1e293b" stroke="#ffffff" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="420" y="600" width="30" height="20" rx="2" fill="#334155"/>
  <circle cx="445" cy="630" r="3.5" fill="#10b981"/>
  <!-- 2-Way Splitter Icon next to Amplifier -->
  <rect x="466" y="604" width="22" height="26" rx="3" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="477" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" font-weight="800" fill="#5eead4">2-WAY</text>

  <!-- Callout Badge 2 (Amplifiers + Splitters in Existing Racks) -->
  <rect x="465" y="275" width="375" height="64" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#softShadow)"/>
  <circle cx="488" cy="298" r="13" fill="#0d9488"/>
  <text x="488" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">2</text>
  <text x="510" y="295" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#115e59">2x Amplificadores weBoost Office 200 + Splitters</text>
  <text x="510" y="312" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Instalados en Rack Piso -1 Seguridad y Rack Piso 1</text>
  <text x="510" y="327" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f766e">Splitter 2 Vías (859957) divide señal hacia 2 Domos por equipo</text>

  <!-- ===================================================================== -->
  <!-- STEP 3: INDOOR DOME ANTENNAS IN CEILING (PURPLE HEMISPHERES)          -->
  <!-- ===================================================================== -->
  <!-- Dome 2A in Sala de Concejo Municipal (Piso 1 Ceiling) -->
  <path d="M845 359 A60 56 0 0 0 965 359 Z" fill="#7c3aed" fill-opacity="0.38"/>
  <rect x="887" y="356" width="36" height="7" rx="3" fill="#ffffff" stroke="#4c1d95" stroke-width="2"/>
  <text x="905" y="388" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#5b21b6">Domo 2A (314407)</text>

  <!-- Dome 1A in Subterráneo Seguridad Ciudadana + Video Wall + Móviles -->
  <path d="M537 520 A60 56 0 0 0 657 520 Z" fill="#7c3aed" fill-opacity="0.38"/>
  <rect x="579" y="517" width="36" height="7" rx="3" fill="#ffffff" stroke="#4c1d95" stroke-width="2"/>
  <text x="597" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#5b21b6">Domo 1A (314407)</text>

  <!-- Dome 1B in Subterráneo Servicios Especiales -->
  <path d="M742 520 A60 56 0 0 0 862 520 Z" fill="#7c3aed" fill-opacity="0.38"/>
  <rect x="784" y="517" width="36" height="7" rx="3" fill="#ffffff" stroke="#4c1d95" stroke-width="2"/>
  <text x="802" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#5b21b6">Domo 1B (314407)</text>

  <!-- Dome 2B in Subterráneo Oficina Álvaro Carreño + Pasillo Trasero -->
  <path d="M940 520 A60 56 0 0 0 1060 520 Z" fill="#7c3aed" fill-opacity="0.38"/>
  <rect x="982" y="517" width="36" height="7" rx="3" fill="#ffffff" stroke="#4c1d95" stroke-width="2"/>
  <text x="1000" y="548" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#5b21b6">Domo 2B (314407)</text>

  <!-- Callout Badge 3 (4x Indoor Dome Antennas in False Ceiling) -->
  <rect x="705" y="218" width="390" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#softShadow)"/>
  <circle cx="728" cy="241" r="13" fill="#7c3aed"/>
  <text x="728" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff">3</text>
  <text x="750" y="238" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#4c1d95">4x Antenas Domo de Techo 360° (314407)</text>
  <text x="750" y="255" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Empotradas en cielo falso de Piso -1 (3 Domos) y Piso 1 (1 Domo)</text>
  <text x="750" y="270" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6d28d9">Irradian señal 4G LTE / VoLTE limpia (-62 a -68 dBm)</text>

  <!-- ===================================================================== -->
  <!-- DOTTED COAXIAL CABLE ROUTES (EXACT STYLE OF REFERENCE IMAGE)          -->
  <!-- ===================================================================== -->
  <!-- Downlead Coax Wilson400 18,28 m (952360) from Rooftop Omni down the Vertical Shaft -->
  <path d="M245 142 V186 H380 V615 H413" fill="none" stroke="#be123c" stroke-width="3.2" stroke-dasharray="5,5"/>
  <!-- Branch into Rack Piso 1 (Sistema 2) -->
  <path d="M380 442 H415" fill="none" stroke="#be123c" stroke-width="3.2" stroke-dasharray="5,5"/>

  <!-- Label for Vertical Drop Cable -->
  <rect x="172" y="280" width="178" height="44" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="261" y="298" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" fill="#9f1239">Bajada Vertical: 18,28 m</text>
  <text x="261" y="314" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#be123c">Cable Wilson400 (952360)</text>

  <!-- Horizontal Ceiling Coax from Rack Piso 1 to Domo 2A (Sala Concejo) & Domo 2B (Oficina Álvaro Piso -1) -->
  <path d="M445 422 V352 H905 V356" fill="none" stroke="#be123c" stroke-width="2.8" stroke-dasharray="5,5"/>
  <path d="M455 442 H485 V512 H1000 V517" fill="none" stroke="#0d9488" stroke-width="2.8" stroke-dasharray="5,5"/>

  <!-- Horizontal Ceiling Coax in Piso -1 from Rack Seguridad Splitter to Domo 1A & Domo 1B -->
  <path d="M477 604 V515 H802 V517" fill="none" stroke="#be123c" stroke-width="2.8" stroke-dasharray="5,5"/>
  <path d="M597 515 V517" fill="none" stroke="#be123c" stroke-width="2.8" stroke-dasharray="5,5"/>

  <!-- Label for Ceiling Distribution Coax -->
  <rect x="520" y="486" width="245" height="22" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="642" y="501" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#9f1239">Tendido por Bandeja/Cielo Falso: 15,24 m y 22,86 m</text>
</svg>
